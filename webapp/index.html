<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#121417">
<title>Fichaje QR</title>
<link rel="stylesheet" href="styles.css">
<style>
  .screen { display: none; }
  .screen.active { display: block; }
  .op-btns { display: grid; gap: 12px; }
  #reader { width: 100%; border-radius: var(--radius); overflow: hidden; background: #000; min-height: 260px; }
  #reader video { object-fit: cover; }
  .estado-actual { margin: 14px 0; }
  .ultimo { font-size: 1.05rem; padding: 12px; border-radius: 10px; background: var(--panel-2); margin-top: 12px; min-height: 48px; }
</style>
</head>
<body>
<header class="topbar">
  <div>
    <h1>Fichaje QR · Taller</h1>
    <div class="sub" id="sub-operario">Elegí quién sos</div>
  </div>
  <div class="row">
    <span class="pill hidden" id="pendientes"></span>
    <span class="pill" id="estado-red"><span class="dot"></span> …</span>
  </div>
</header>

<main class="wrap">
  <!-- Elegir operario (se hace una sola vez en cada celular) -->
  <section class="screen" id="scr-login">
    <h2>¿Quién usa este celular?</h2>
    <div class="op-btns" id="lista-operarios"><p class="muted">Cargando…</p></div>
  </section>

  <!-- Escaneo continuo -->
  <section class="screen" id="scr-scan">
    <div class="op-card estado-actual" id="card-estado"></div>
    <div id="reader"></div>
    <p class="muted small" style="margin:8px 0 0">Apuntá al QR del <b>proyecto</b> y después al de la <b>operación</b>. Para terminar, escaneá de nuevo la misma operación.</p>
    <div class="ultimo" id="ultimo">&nbsp;</div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="btn-camara">Pausar cámara</button>
      <button class="btn" id="btn-cambiar">Cambiar de operario</button>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let CFG = { operarios: [] };
let operario = null;
try { operario = localStorage.getItem('fichaje_operario'); } catch (e) {}
let estado = null;
let scanner = null, camaraActiva = false;
let ultimoCodigo = '', ultimoTs = 0;

function pantalla(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }
function setRed(ok) { const el = $('estado-red'); el.className = 'pill ' + (ok ? 'ok' : 'bad'); el.innerHTML = `<span class="dot"></span> ${ok ? 'Conectado' : 'Sin conexión'}`; }

const cola = crearCola('celular_cola', (item, res) => {
  setRed(true);
  if (!res.ok) { Sonido.error(); vibrar([300, 100, 300]); mostrar('✖ ' + res.error, 'error'); return; }
  if (res.alerta) { Sonido.alerta(); vibrar([200, 100, 200, 100, 200]); }
  else { (res.tipo === 'inicio' ? Sonido.inicio : res.tipo === 'proyecto' ? Sonido.ok : Sonido.cierre)(); vibrar(120); }
  mostrar((res.alerta ? '⚠ ' : '✔ ') + res.mensaje.replace(operario + ': ', ''), res.alerta ? 'alerta' : 'ok');
  refrescar();
}, (n, sinRed) => {
  const el = $('pendientes');
  el.className = 'pill warn' + (n ? '' : ' hidden');
  el.textContent = `${n} sin enviar`;
  if (sinRed) setRed(false);
});

function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function mostrar(t, clase) { const el = $('ultimo'); el.textContent = t; el.className = 'ultimo msg ' + (clase || ''); }

function onScan(texto) {
  const ahora = Date.now();
  if (texto === ultimoCodigo && ahora - ultimoTs < 4000) return; // la cámara lee el mismo QR muchas veces seguidas
  ultimoCodigo = texto; ultimoTs = ahora;
  mostrar('Enviando ' + texto + '…');
  cola.agregar({ codigo: texto, operario, ts: ahora, origen: 'Celular' });
}

async function iniciarCamara() {
  if (camaraActiva) return;
  try {
    scanner = scanner || new Html5Qrcode('reader');
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, onScan, () => {});
    camaraActiva = true;
    $('btn-camara').textContent = 'Pausar cámara';
  } catch (e) {
    mostrar('No se pudo abrir la cámara: ' + (e.message || e) + '. Revisá el permiso de cámara del navegador.', 'error');
  }
}
async function pararCamara() {
  if (!camaraActiva) return;
  try { await scanner.stop(); } catch (e) {}
  camaraActiva = false;
  $('btn-camara').textContent = 'Encender cámara';
}

function renderEstado() {
  const card = $('card-estado');
  const a = estado && estado.abierta;
  card.className = 'op-card estado-actual ' + (!a ? 'libre' : a.tipo === 'Pausa' ? 'pausa' : 'trabajando');
  card.innerHTML = `
    <div class="nombre">${esc(operario)}</div>
    <div class="actividad">${a ? esc(opConBanco(a)) : 'Sin operación abierta'}</div>
    <div class="proyecto">${a && a.proyecto ? 'Proyecto ' + esc(a.proyecto) : '&nbsp;'}
      ${estado && estado.proyectoPendiente ? `<br><span style="color:var(--blue)">Proyecto ${esc(estado.proyectoPendiente)} escaneado → ahora la operación</span>` : ''}</div>
    <div class="timer">${a ? fmtDur((Date.now() - a.inicio) / 60000) : '—'}</div>`;
}

async function refrescar() {
  try {
    const r = await Api.get('estado');
    if (!r.ok) throw new Error(r.error);
    estado = r.operarios.find(o => o.nombre === operario) || null;
    setRed(true);
    renderEstado();
  } catch (e) { setRed(false); }
}

function elegir(nombre) {
  operario = nombre;
  try { localStorage.setItem('fichaje_operario', nombre); } catch (e) {}
  $('sub-operario').textContent = nombre;
  pantalla('scr-scan');
  renderEstado();
  refrescar();
  iniciarCamara();
}

$('btn-cambiar').addEventListener('click', async () => {
  await pararCamara();
  operario = null;
  try { localStorage.removeItem('fichaje_operario'); } catch (e) {}
  $('sub-operario').textContent = 'Elegí quién sos';
  pantalla('scr-login');
});
$('btn-camara').addEventListener('click', () => camaraActiva ? pararCamara() : iniciarCamara());
document.addEventListener('visibilitychange', () => { if (!document.hidden && operario) refrescar(); });

(async () => {
  try {
    const r = await Api.get('config');
    if (!r.ok) throw new Error(r.error);
    CFG = r; setRed(true);
  } catch (e) {
    setRed(false);
    $('lista-operarios').innerHTML = `<p class="msg error">No se pudo conectar: ${esc(e.message)}</p>`;
  }
  $('lista-operarios').innerHTML = CFG.operarios.map(o => `<button class="btn lg" data-n="${esc(o.nombre)}">${esc(o.nombre)}</button>`).join('') || $('lista-operarios').innerHTML;
  $('lista-operarios').querySelectorAll('button').forEach(b => b.addEventListener('click', () => elegir(b.dataset.n)));
  if (operario && CFG.operarios.some(o => o.nombre === operario)) elegir(operario); else pantalla('scr-login');
  setInterval(() => { if (operario) renderEstado(); }, 1000);
  setInterval(() => { if (operario) refrescar(); }, APP_CONFIG.REFRESCO_SEG * 1000);
})();
</script>
</body>
</html>
